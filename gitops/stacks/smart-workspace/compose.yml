version: "3.9"

services:
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: code-server
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Prague
      - PASSWORD=artanox2912
      - EXTENSIONS=GitHub.copilot,esbenp.prettier-vscode,dbaeumer.vscode-eslint,bradlc.vscode-tailwindcss,ritwickdey.liveserver
    volumes:
      - workspace_data:/config
    ports:
      - "8080:8443"
    networks:
      - smart-net
    restart: unless-stopped
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: smart-db
    environment:
      POSTGRES_DB: smart_db
      POSTGRES_PASSWORD: artanox2912
      POSTGRES_USER: smart_user
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - smart-net
    restart: unless-stopped

  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    depends_on:
      - db
    environment:
      DB_TYPE: postgres
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: smart_user
      DB_PASS: artanox2912
      DB_NAME: smart_db
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - wiki_data:/wiki/storage
    networks:
      - smart-net

networks:
  smart-net:
    driver: bridge

volumes:
  workspace_data:
  db_data:
  wiki_data:
